<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Umleitung Pilot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/3.6.2/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/3.6.2/maplibre-gl.min.js"></script>
<style>
  :root{
    --sign:#f7c600; --sign-ink:#141414;
    --line:#e3e5e8; --text:#1c1e21; --muted:#70757a;
    --gblue:#4356f2; --gblue-dark:#2a3ac2;
    --teal:#0b7d75; --red:#ea4335; --ok:#188038;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Google Sans',system-ui,-apple-system,Roboto,sans-serif;background:#f2f3f5;color:var(--text);display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0;z-index:20}
  .logo{background:var(--sign);color:var(--sign-ink);font-weight:900;padding:3px 8px;border-radius:4px;border:2px solid var(--sign-ink);font-size:12px;text-transform:uppercase}
  header .sub{font-size:11px;color:var(--muted);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .spacer{flex:1}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lang-toggle button{background:#fff;color:var(--muted);border:0;padding:6px 11px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer}
  .lang-toggle button.active{background:var(--sign);color:var(--sign-ink)}

  #wrap{position:relative;flex:1;min-height:0}
  #map{position:absolute;inset:0}

  /* Compact turn pill (small, like Google) */
  #hud{display:none;position:absolute;top:10px;left:10px;z-index:30;background:var(--ok);color:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:7px 12px;align-items:center;gap:9px}
  #hud.on{display:flex}
  #hud .arrow{font-size:22px;line-height:1;font-weight:900}
  #hud .dist{font-size:16px;font-weight:800;white-space:nowrap;line-height:1.1}
  #hud .what{font-size:10px;font-weight:600;opacity:.9;white-space:nowrap}

  /* Recenter — white circle with blue dot, like Google */
  #recenter{display:none;position:absolute;right:12px;bottom:14px;z-index:30;width:52px;height:52px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;align-items:center;justify-content:center}
  #recenter.show{display:flex}
  #recenter .dot{width:16px;height:16px;border-radius:50%;background:#1a73e8;box-shadow:0 0 0 5px #d2e3fc}

  /* Position markers */
  .pos-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .pos-arrow{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:28px solid #1a73e8;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));position:relative}
  .pos-arrow::after{content:"";position:absolute;left:-8px;top:9px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:17px solid #fff}
  .dest-pin{width:26px;height:26px;background:var(--red);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #b3170b;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .dest-pin::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#7a0f06}
  .time-chip{background:var(--gblue);color:#fff;font-weight:800;font-size:14px;padding:5px 12px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;position:relative}
  .time-chip::after{content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:var(--gblue);border-left:0}

  #toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:60;background:#1c1e21;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
  #toast.show{opacity:1}

  /* ── Google-style bottom sheet ── */
  #sheet{flex-shrink:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);padding:8px 18px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;margin-top:-20px;position:relative}
  .handle{width:44px;height:5px;border-radius:3px;background:#dadce0;margin:4px auto 10px}
  .state{display:none}
  .state.on{display:block}

  /* empty state */
  #stEmpty .hint{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:12px}
  .btnrow{display:flex;gap:10px;align-items:center}
  .pill{border:0;border-radius:26px;padding:14px 24px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .pill:active{transform:scale(.97)}
  .pill-teal{background:var(--teal);color:#fff}
  .pill-light{background:#e8f0fe;color:#1a58c2}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
  label.pill, label.chip{user-select:none}

  /* loaded state — like the Google route summary */
  #stLoaded .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
  #stLoaded .big .km{color:var(--muted);font-weight:700}
  #stLoaded .subtitle{color:var(--muted);font-size:13px;margin:2px 0 14px}
  /* nav state */
  #stNav{display:none;align-items:center;gap:14px}
  #stNav.on{display:flex}
  #stNav .eta-main{font-size:22px;font-weight:800;color:var(--ok)}
  #stNav .eta-sub{font-size:12px;color:var(--muted)}
  #stNav .phase{font-size:11px;font-weight:800;color:var(--gblue);text-transform:uppercase;letter-spacing:.04em}
  #stNav.offroute .phase{color:var(--red)}
  #stNav .spacer{flex:1}
  .btn-x{width:52px;height:52px;border-radius:50%;border:0;background:#fce8e6;color:var(--red);font-size:22px;font-weight:900;cursor:pointer}

  #pasteModal{display:none;position:absolute;inset:0;z-index:80;background:rgba(255,255,255,.97);padding:18px;flex-direction:column;gap:10px}
  #pasteModal textarea{flex:1;background:#f7f8fa;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font-family:monospace;font-size:12px;resize:none}
  .hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">Umleitung</div>
  <div>
    <div style="font-weight:800;font-size:13px">Pilot</div>
    <div class="sub" id="routeName">Rota yüklenmedi</div>
  </div>
  <div class="spacer"></div>
  <div class="lang-toggle">
    <button id="langTR" class="active">TR</button>
    <button id="langDE">DE</button>
  </div>
</header>

<div id="wrap">
  <div id="map"></div>

  <div id="hud">
    <div class="arrow" id="hudArrow">&#8593;</div>
    <div>
      <div class="dist" id="hudDist">–</div>
      <div class="what" id="hudWhat">–</div>
    </div>
  </div>

  <button id="recenter" title="Konuma dön"><span class="dot"></span></button>
  <div id="toast"></div>

  <div id="pasteModal">
    <div style="font-weight:800;font-size:15px">KML / GPX içeriğini yapıştır</div>
    <textarea id="pasteArea" placeholder="Dosya içeriğini buraya yapıştır"></textarea>
    <div class="btnrow">
      <button class="chip" id="pasteCancel">Vazgeç</button>
      <button class="pill pill-teal" id="pasteOk">Rotayı Çiz</button>
    </div>
  </div>
</div>

<div id="sheet">
  <div class="handle"></div>

  <div class="state on" id="stEmpty">
    <div class="hint"><b>KML</b> veya <b>GPX</b> dosyanı yükle — bulunduğun yerden başlangıca otobüs geçebilecek yollardan götürür, sonra Umleitung'u sesli anlatır.</div>
    <div class="btnrow">
      <label class="pill pill-teal" for="fileInput">&#128194; Dosya Yükle</label>
      <button class="chip" id="btnPaste">&#128203; Yapıştır</button>
    </div>
  </div>

  <div class="state" id="stLoaded">
    <div class="big"><span id="sumTime">–</span> <span class="km">(<span id="sumDist">–</span>)</span></div>
    <div class="subtitle" id="sumSub">Umleitung rotası</div>
    <div class="btnrow">
      <button class="pill pill-teal" id="btnGo">&#9650; Başlat</button>
      <button class="chip" id="btnSim">SİM test</button>
      <label class="chip" for="fileInput">Yeni dosya</label>
    </div>
  </div>

  <div class="state" id="stNav">
    <button class="btn-x" id="btnStop">&#10005;</button>
    <div>
      <div class="phase" id="etaPhase">Başlangıca</div>
      <div class="eta-main" id="etaTime">–</div>
      <div class="eta-sub"><span id="etaDist">–</span> · <span id="etaSpeed">0</span> km/h</div>
    </div>
    <div class="spacer"></div>
  </div>

  <input type="file" id="fileInput" accept=".kml,.gpx" class="hidden">
</div>

<script>
"use strict";

/* ═══════ State ═══════ */
let map, posMarker=null, destMarker=null, chipMarker=null, mapReady=false;
let baseRoute=null, route=null;
let navActive=false, watchId=null, simTimer=null, wakeLock=null;
let voiceLang='tr';
let nextTurnIdx=0, announced={}, arrivalSpoken=false, onMainSpoken=true;
let follow=true, lastFix=null, smoothSpeed=0, markerAnim=null;
const BUS_AVG_KMH=22; // realistic city-bus average for estimates

const $=id=>document.getElementById(id);

/* ═══════ Map (MapLibre GL) ═══════ */
map=new maplibregl.Map({
  container:'map',
  style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]},
  center:[9.73,52.35],zoom:12,attributionControl:true
});
map.on('load',()=>{
  mapReady=true;
  map.addSource('approach',{type:'geojson',data:emptyGeo()});
  map.addSource('main',{type:'geojson',data:emptyGeo()});
  map.addSource('startpt',{type:'geojson',data:emptyGeo()});
  /* Google-style: dark navy casing + vivid blue fill, rounded */
  map.addLayer({id:'approach-casing',type:'line',source:'approach',paint:{'line-color':'#2a3ac2','line-width':11},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'approach-line',type:'line',source:'approach',paint:{'line-color':'#4356f2','line-width':7},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'main-casing',type:'line',source:'main',paint:{'line-color':'#141414','line-width':11},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'main-line',type:'line',source:'main',paint:{'line-color':'#f7c600','line-width':7},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'startpt-circle',type:'circle',source:'startpt',paint:{'circle-radius':7,'circle-color':'#188038','circle-stroke-color':'#fff','circle-stroke-width':3}});
});
function emptyGeo(){return {type:'FeatureCollection',features:[]};}
function lineFeature(pts){return {type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'LineString',coordinates:pts.map(p=>[p.lng,p.lat])},properties:{}}]};}

/* Any user gesture pauses follow — the map never snaps back */
function pauseFollow(e){if(navActive&&e&&e.originalEvent){follow=false;$("recenter").classList.add("show");}}
map.on('movestart',pauseFollow);
map.on('rotatestart',pauseFollow);
map.on('zoomstart',pauseFollow);
$("recenter").onclick=()=>{follow=true;$("recenter").classList.remove("show");if(lastFix)cameraTo(lastFix,300);};

/* ═══════ Geometry ═══════ */
const R=6371000,toRad=d=>d*Math.PI/180,toDeg=r=>r*180/Math.PI;
function haversine(a,b){const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);const s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function bearing(a,b){const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat));const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));return (toDeg(Math.atan2(y,x))+360)%360;}
function angleDiff(b1,b2){let d=b2-b1;while(d>180)d-=360;while(d<-180)d+=360;return d;}
function projectOnRoute(p){
  let best={s:0,d:Infinity};
  for(let i=0;i<route.pts.length-1;i++){
    const a=route.pts[i],b=route.pts[i+1];
    const kx=Math.cos(toRad(a.lat))*111320,ky=110540;
    const bx=(b.lng-a.lng)*kx,by=(b.lat-a.lat)*ky;
    const px=(p.lng-a.lng)*kx,py=(p.lat-a.lat)*ky;
    const len2=bx*bx+by*by;let t=len2?((px*bx+py*by)/len2):0;t=Math.max(0,Math.min(1,t));
    const dx=px-t*bx,dy=py-t*by;const d=Math.sqrt(dx*dx+dy*dy);
    if(d<best.d){best.d=d;best.s=route.cum[i]+t*(route.cum[i+1]-route.cum[i]);}
  }
  return best;
}
function pointAtS(r,s){
  let i=1;while(i<r.cum.length&&r.cum[i]<s)i++;
  i=Math.min(i,r.pts.length-1);
  const a=r.pts[i-1],b=r.pts[i];
  const seg=r.cum[i]-r.cum[i-1]||1;
  const t=Math.max(0,Math.min(1,(s-r.cum[i-1])/seg));
  return {lat:a.lat+(b.lat-a.lat)*t,lng:a.lng+(b.lng-a.lng)*t};
}

/* ═══════ Parsing ═══════ */
function parseFile(name,text){
  const dom=new DOMParser().parseFromString(text,"application/xml");
  if(dom.querySelector("parsererror"))throw new Error("Dosya okunamadı — geçerli bir KML/GPX değil.");
  let pts=[],routeName=name.replace(/\.(kml|gpx)$/i,"");
  if(name.toLowerCase().endsWith(".gpx")||dom.querySelector("gpx")){
    dom.querySelectorAll("trkpt, rtept").forEach(n=>pts.push({lat:+n.getAttribute("lat"),lng:+n.getAttribute("lon")}));
    const nm=dom.querySelector("trk > name, rte > name, metadata > name");if(nm)routeName=nm.textContent.trim();
  }else{
    dom.querySelectorAll("LineString > coordinates").forEach(c=>{
      c.textContent.trim().split(/\s+/).forEach(trip=>{const[lng,lat]=trip.split(",").map(Number);if(isFinite(lat)&&isFinite(lng))pts.push({lat,lng});});
    });
    if(!pts.length)dom.querySelectorAll("coord").forEach(c=>{const[lng,lat]=c.textContent.trim().split(/\s+/).map(Number);if(isFinite(lat)&&isFinite(lng))pts.push({lat,lng});});
    const nm=dom.querySelector("Document > name, Placemark > name");if(nm)routeName=nm.textContent.trim();
  }
  if(pts.length<2)throw new Error("Dosyada çizgi (rota) bulunamadı.");
  const simp=[pts[0]];
  for(const p of pts)if(haversine(simp[simp.length-1],p)>=8)simp.push(p);
  if(haversine(simp[simp.length-1],pts[pts.length-1])>1)simp.push(pts[pts.length-1]);
  return {name:routeName,pts:simp};
}

/* ═══════ Turn analysis ═══════ */
function analyzeRoute(r){
  const pts=r.pts;r.cum=[0];
  for(let i=1;i<pts.length;i++)r.cum[i]=r.cum[i-1]+haversine(pts[i-1],pts[i]);
  r.total=r.cum[pts.length-1];
  const LOOK=20;
  const bB=i=>{let j=i;while(j>0&&r.cum[i]-r.cum[j]<LOOK)j--;return bearing(pts[j],pts[i]);};
  const bA=i=>{let j=i;while(j<pts.length-1&&r.cum[j]-r.cum[i]<LOOK)j++;return bearing(pts[i],pts[j]);};
  let turns=[];
  for(let i=2;i<pts.length-2;i++){
    const d=angleDiff(bB(i),bA(i));
    if(Math.abs(d)>=35)turns.push({idx:i,s:r.cum[i],dir:d>0?"R":"L",angle:Math.abs(d)});
  }
  const merged=[];
  for(const t of turns){
    const last=merged[merged.length-1];
    if(last&&t.s-last.s<40){if(t.angle>last.angle)merged[merged.length-1]=t;}
    else merged.push(t);
  }
  r.turns=merged;
}

/* ═══════ Voice ═══════ */
const PHRASES={
  tr:{far:(m,d)=>`${m} metre sonra ${d==="R"?"sağa":"sola"} dönün`,now:d=>`Şimdi ${d==="R"?"sağa":"sola"} dönün`,sharp:d=>`keskin ${d==="R"?"sağ":"sol"}`,
    start:"Navigasyon başladı. Rotayı takip edin.",offroute:"Rotadan çıktınız",back:"Rotaya döndünüz",
    arrive:"Hedefe ulaştınız. Rota tamamlandı.",approach:"Önce Umleitung başlangıcına yönlendiriliyorsunuz",
    onroute:"Umleitung rotasına girdiniz",turnR:"Sağa dön",turnL:"Sola dön",toStart:"Başlangıca",toEnd:"Hedefe"},
  de:{far:(m,d)=>`In ${m} Metern ${d==="R"?"rechts":"links"} abbiegen`,now:d=>`Jetzt ${d==="R"?"rechts":"links"} abbiegen`,sharp:d=>`scharf ${d==="R"?"rechts":"links"}`,
    start:"Navigation gestartet. Folgen Sie der Route.",offroute:"Sie haben die Route verlassen",back:"Zurück auf der Route",
    arrive:"Sie haben Ihr Ziel erreicht.",approach:"Sie werden zuerst zum Beginn der Umleitung geführt",
    onroute:"Sie sind jetzt auf der Umleitungsroute",turnR:"Rechts abbiegen",turnL:"Links abbiegen",toStart:"Zum Start",toEnd:"Zum Ziel"}
};
const P=()=>PHRASES[voiceLang];
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voiceLang==="tr"?"tr-TR":"de-DE";speechSynthesis.speak(u);}catch(e){}}

/* ═══════ UI helpers ═══════ */
function toast(msg,ms=3500){$("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>$("toast").classList.remove("show"),ms);}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1).replace(".",",")+" km":Math.round(m/10)*10+" m";}
function fmtTime(min){if(min<1)return "1 dk";if(min<60)return Math.round(min)+" dk";return Math.floor(min/60)+" sa "+Math.round(min%60)+" dk";}
function setSheet(state){["stEmpty","stLoaded","stNav"].forEach(id=>$(id).classList.toggle("on",id===state));}

/* ═══════ Route display ═══════ */
function makeDomMarker(className,html){
  const el=document.createElement('div');el.className=className;if(html)el.innerHTML=html;return el;
}
function displayRoute(r){
  if(!mapReady){map.once('load',()=>displayRoute(r));return;}
  const ai=r.approachIdx||0;
  map.getSource('approach').setData(ai>0?lineFeature(r.pts.slice(0,ai+1)):emptyGeo());
  map.getSource('main').setData(lineFeature(r.pts.slice(ai)));
  map.getSource('startpt').setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[r.pts[ai].lng,r.pts[ai].lat]},properties:{}}]});

  /* red destination pin (DOM marker, like Google) */
  const end=r.pts[r.pts.length-1];
  if(destMarker)destMarker.remove();
  destMarker=new maplibregl.Marker({element:makeDomMarker('dest-pin'),anchor:'bottom'}).setLngLat([end.lng,end.lat]).addTo(map);

  /* blue time chip at route midpoint */
  const est=fmtTime((r.total/1000)/BUS_AVG_KMH*60);
  const mid=pointAtS(r,r.total*0.5);
  if(chipMarker)chipMarker.remove();
  chipMarker=new maplibregl.Marker({element:makeDomMarker('time-chip','≈ '+est),anchor:'left',offset:[10,0]}).setLngLat([mid.lng,mid.lat]).addTo(map);

  if(!navActive){
    let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
    r.pts.forEach(p=>{minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLng=Math.min(minLng,p.lng);maxLng=Math.max(maxLng,p.lng);});
    map.fitBounds([[minLng,minLat],[maxLng,maxLat]],{padding:70,duration:600});
  }
  $("routeName").textContent=r.name;
  $("sumTime").textContent="≈ "+est;
  $("sumDist").textContent=fmtDist(r.total);
  $("sumSub").textContent=(voiceLang==="tr"?"Otobüs rotası · ":"Busroute · ")+r.turns.length+(voiceLang==="tr"?" dönüş":" Abbiegungen");
  if(!navActive)setSheet("stLoaded");
}

/* ═══════ Marker & camera ═══════ */
function setMarkerMode(mode){ // 'dot' | 'arrow'
  const el=makeDomMarker(mode==='arrow'?'pos-arrow':'pos-dot');
  const pos=posMarker?posMarker.getLngLat():null;
  if(posMarker)posMarker.remove();
  posMarker=new maplibregl.Marker({element:el,rotationAlignment:mode==='arrow'?'map':'viewport',anchor:'center'});
  if(pos)posMarker.setLngLat(pos).addTo(map);
}
function ensureMarker(lat,lng,mode){
  if(!posMarker){setMarkerMode(mode||'dot');posMarker.setLngLat([lng,lat]).addTo(map);}
}
function moveMarkerSmooth(from,to,heading,dur=900){
  if(markerAnim)cancelAnimationFrame(markerAnim);
  posMarker.setRotation(heading);
  const t0=performance.now();
  function step(t){
    const k=Math.min(1,(t-t0)/dur);
    posMarker.setLngLat([from.lng+(to.lng-from.lng)*k,from.lat+(to.lat-from.lat)*k]);
    if(k<1)markerAnim=requestAnimationFrame(step);
  }
  markerAnim=requestAnimationFrame(step);
}
function cameraTo(fix,dur=900){
  map.easeTo({center:[fix.lng,fix.lat],bearing:fix.heading||0,duration:dur,easing:t=>t});
}

/* ═══════ Nav core ═══════ */
function updateHUD(remaining,turn){
  const hud=$("hud");hud.classList.add("on");
  if(!turn){$("hudArrow").innerHTML="&#127937;";$("hudDist").textContent=fmtDist(remaining);$("hudWhat").textContent=voiceLang==="tr"?"Hedef":"Ziel";return;}
  $("hudArrow").innerHTML=turn.dir==="R"?"&#10548;":"&#10547;";
  $("hudDist").textContent=fmtDist(remaining);
  $("hudWhat").textContent=(turn.dir==="R"?P().turnR:P().turnL)+(turn.angle>110?" · "+P().sharp(turn.dir):"");
}
function updateETA(proj){
  const inApproach=(route.approachS||0)>0&&proj.s<route.approachS;
  const target=inApproach?route.approachS:route.total;
  const rem=Math.max(0,target-proj.s);
  const spd=Math.max(smoothSpeed,BUS_AVG_KMH/3.6);
  $("etaPhase").textContent=inApproach?P().toStart:P().toEnd;
  $("etaTime").textContent=fmtTime(rem/spd/60);
  $("etaDist").textContent=fmtDist(rem);
  $("etaSpeed").textContent=Math.round(smoothSpeed*3.6);
}
function onPosition(lat,lng,speedMs,gpsHeading){
  if(!navActive||!route)return;
  const prev=lastFix;
  let heading=gpsHeading!=null&&isFinite(gpsHeading)&&(speedMs||0)>1?gpsHeading:(prev?bearing(prev,{lat,lng}):0);
  if(prev&&haversine(prev,{lat,lng})<2)heading=prev.heading;
  const fix={lat,lng,heading,speed:speedMs};
  if(speedMs!=null&&isFinite(speedMs))smoothSpeed=smoothSpeed*.7+speedMs*.3;
  ensureMarker(lat,lng,'arrow');
  if(prev)moveMarkerSmooth(prev,fix,heading);else posMarker.setLngLat([lng,lat]);
  if(follow)cameraTo(fix);
  lastFix=fix;

  const proj=projectOnRoute({lat,lng});
  if(!onMainSpoken&&proj.s>=(route.approachS||0)){onMainSpoken=true;speak(P().onroute);}
  updateETA(proj);

  const nav=$("stNav");
  if(proj.d>60){
    if(!nav.classList.contains("offroute")){nav.classList.add("offroute");speak(P().offroute);}
    return;
  }else if(nav.classList.contains("offroute")){nav.classList.remove("offroute");speak(P().back);}

  while(nextTurnIdx<route.turns.length&&route.turns[nextTurnIdx].s<proj.s-25)nextTurnIdx++;
  const turn=route.turns[nextTurnIdx]||null;
  if(!turn){
    const remToEnd=route.total-proj.s;
    updateHUD(remToEnd,null);
    if(remToEnd<40&&!arrivalSpoken){arrivalSpoken=true;speak(P().arrive);stopNav(true);}
    return;
  }
  const rem=turn.s-proj.s;
  updateHUD(rem,turn);
  announced[nextTurnIdx]=announced[nextTurnIdx]||new Set();
  const a=announced[nextTurnIdx];
  if(rem<=320&&rem>220&&!a.has(300)){a.add(300);speak(P().far(300,turn.dir));}
  else if(rem<=120&&rem>60&&!a.has(100)){a.add(100);speak(P().far(100,turn.dir));}
  else if(rem<=45&&!a.has(0)){a.add(0);speak(P().now(turn.dir));}
}

/* ═══════ Location & bus routing ═══════ */
function getPositionOnce(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error("Konum servisi yok"));
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
      err=>reject(new Error(err.code===1?"Konum izni reddedildi.":err.code===2?"GPS sinyali yok.":"Konum zaman aşımı.")),
      {enableHighAccuracy:true,timeout:12000,maximumAge:5000});
  });
}
function decodePolyline(str,precision){
  let index=0,lat=0,lng=0;const coords=[],factor=Math.pow(10,precision||6);
  while(index<str.length){
    let b,shift=0,result=0;
    do{b=str.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);
    lat+=(result&1)?~(result>>1):(result>>1);
    shift=0;result=0;
    do{b=str.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);
    lng+=(result&1)?~(result>>1):(result>>1);
    coords.push({lat:lat/factor,lng:lng/factor});
  }
  return coords;
}
async function fetchApproach(from,to){
  try{
    const body={locations:[{lat:from.lat,lon:from.lng},{lat:to.lat,lon:to.lng}],
      costing:"bus",costing_options:{bus:{width:2.55,height:3.4,length:12.0}},
      directions_options:{units:"kilometers"}};
    const res=await fetch("https://valhalla1.openstreetmap.de/route",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!res.ok)throw new Error("Valhalla "+res.status);
    const data=await res.json();
    const shape=data.trip&&data.trip.legs&&data.trip.legs[0].shape;
    if(!shape)throw new Error("Rota bulunamadı");
    return {pts:decodePolyline(shape,6),profile:"bus"};
  }catch(e){
    const url=`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("Rota servisi cevap vermedi");
    const data=await res.json();
    if(!data.routes||!data.routes.length)throw new Error("Başlangıca rota bulunamadı");
    return {pts:data.routes[0].geometry.coordinates.map(c=>({lat:c[1],lng:c[0]})),profile:"car"};
  }
}
function buildCombined(approachPts,base){
  const simp=[approachPts[0]];
  for(const p of approachPts)if(haversine(simp[simp.length-1],p)>=8)simp.push(p);
  const combined={name:base.name,pts:simp.concat(base.pts)};
  combined.approachIdx=simp.length;
  analyzeRoute(combined);
  combined.approachS=combined.cum[combined.approachIdx];
  return combined;
}

/* ═══════ Start / stop ═══════ */
async function startNav(simulate=false){
  if(!baseRoute)return;
  if(!simulate){
    let here;
    $("btnGo").disabled=true;toast("Konum alınıyor…");
    try{here=await getPositionOnce();}
    catch(e){$("btnGo").disabled=false;toast("Konum alınamadı: "+e.message,6000);return;}
    $("btnGo").disabled=false;
    const start=baseRoute.pts[0];
    route=baseRoute;route.approachIdx=0;route.approachS=0;
    if(haversine(here,start)>120){
      toast("Otobüs rotası hesaplanıyor (2,55 m genişlik)…");
      try{
        const appr=await fetchApproach(here,start);
        route=buildCombined(appr.pts,baseRoute);
        displayRoute(route);
        if(appr.profile==="car")toast("Uyarı: otobüs profili ulaşılamadı, standart araç rotası kullanılıyor.",6000);
      }catch(e){toast("Başlangıç rotası alınamadı: "+e.message,6000);}
    }
  }else{
    route=baseRoute;route.approachIdx=0;route.approachS=0;displayRoute(route);
  }
  navActive=true;nextTurnIdx=0;announced={};arrivalSpoken=false;follow=true;lastFix=null;smoothSpeed=0;
  onMainSpoken=(route.approachS===0);
  $("recenter").classList.remove("show");
  setSheet("stNav");
  setMarkerMode('arrow');
  if(chipMarker){chipMarker.remove();chipMarker=null;} /* clear chip during nav — clean screen */
  map.easeTo({zoom:17,duration:600});
  speak(route.approachS>0?P().approach:P().start);
  try{wakeLock=await navigator.wakeLock?.request("screen");}catch(e){}
  if(simulate){
    let s=0;const step=12.5;
    simTimer=setInterval(()=>{
      s+=step;if(s>=route.total)s=route.total;
      const p=pointAtS(route,s);
      onPosition(p.lat,p.lng,12.5,null);
      if(s>=route.total)clearInterval(simTimer);
    },1000);
    toast("Simülasyon — sanal test sürüşü");
  }else{
    watchId=navigator.geolocation.watchPosition(
      p=>onPosition(p.coords.latitude,p.coords.longitude,p.coords.speed,p.coords.heading),
      err=>toast("Konum alınamadı: "+err.message,5000),
      {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  }
}
function stopNav(finished=false){
  navActive=false;
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(simTimer){clearInterval(simTimer);simTimer=null;}
  if(markerAnim)cancelAnimationFrame(markerAnim);
  try{wakeLock?.release();}catch(e){}wakeLock=null;
  $("hud").classList.remove("on");
  $("recenter").classList.remove("show");
  $("stNav").classList.remove("offroute");
  if(posMarker){posMarker.remove();posMarker=null;}
  lastFix=null;
  if(!finished)speechSynthesis.cancel();
  map.easeTo({bearing:0,duration:500});
  if(baseRoute){route=baseRoute;route.approachIdx=0;route.approachS=0;displayRoute(baseRoute);setSheet("stLoaded");}
  else setSheet("stEmpty");
}

/* ═══════ Load ═══════ */
function loadFromText(name,text){
  const r=parseFile(name,text);
  analyzeRoute(r);
  r.approachIdx=0;r.approachS=0;
  baseRoute=r;route=r;
  displayRoute(r);
  toast(`Rota yüklendi: ${r.turns.length} dönüş noktası bulundu`);
}
$("fileInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{loadFromText(f.name,reader.result);}catch(err){toast("Hata: "+err.message,5000);}};
  reader.onerror=()=>toast("Dosya okunamadı",4000);
  reader.readAsText(f);e.target.value="";
};
$("btnGo").onclick=()=>startNav(false);
$("btnSim").onclick=()=>startNav(true);
$("btnStop").onclick=()=>stopNav();
$("btnPaste").onclick=()=>{$("pasteModal").style.display="flex";$("pasteArea").focus();};
$("pasteCancel").onclick=()=>{$("pasteModal").style.display="none";};
$("pasteOk").onclick=()=>{
  const txt=$("pasteArea").value.trim();
  if(!txt){toast("Önce içeriği yapıştır");return;}
  try{
    loadFromText(txt.includes("<gpx")?"rota.gpx":"rota.kml",txt);
    $("pasteModal").style.display="none";$("pasteArea").value="";
  }catch(err){toast("Hata: "+err.message,5000);}
};
document.body.addEventListener("dragover",e=>e.preventDefault());
document.body.addEventListener("drop",e=>{
  e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{loadFromText(f.name,reader.result);}catch(err){toast("Hata: "+err.message,5000);}};
  reader.readAsText(f);
});
$("langTR").onclick=()=>{voiceLang="tr";$("langTR").classList.add("active");$("langDE").classList.remove("active");if(baseRoute)displayRoute(route);};
$("langDE").onclick=()=>{voiceLang="de";$("langDE").classList.add("active");$("langTR").classList.remove("active");if(baseRoute)displayRoute(route);};

/* ═══════ First launch: location permission + blue dot ═══════ */
(function initLocation(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(
    p=>{
      const lat=p.coords.latitude,lng=p.coords.longitude;
      if(!baseRoute)map.easeTo({center:[lng,lat],zoom:15,duration:800});
      ensureMarker(lat,lng,'dot');
      toast("Konum izni verildi ✓");
    },
    err=>{if(err.code===1)toast("Konum izni verilmedi. Chrome'da adres çubuğundaki kilit simgesinden izin verebilirsin.",6000);},
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
})();
</script>
